name: verify-examples

# Converts every bundled Sigma rule under examples/sigma/ on push, PR, and a
# weekly schedule. The schedule catches upstream pysigma /
# pysigma-backend-kusto regressions (e.g. a dropped field mapping) even when
# nobody is opening PRs. Same Monday cadence as Dependabot.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-examples:
    name: verify-examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.12 and install project
        run: |
          uv python install 3.12
          uv venv --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: Convert every bundled example rule
        run: pytest tests/test_examples.py -v
